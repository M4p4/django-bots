[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "django-bots"
version = "0.1.0.dev0"
description = "User-agent parsing, crawler detection and AI bot blocking for Django."
readme = "README.md"
keywords = [ "ai", "bots", "crawlers", "django", "robots.txt", "user-agents" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "M4p4", email = "homejr@protonmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "crawler-user-agents>=1.62",
  "django>=5.2",
  "ua-parser>=1,<2",
]
urls.Changelog = "https://github.com/M4p4/django-bots/blob/main/CHANGELOG.md"
urls.Repository = "https://github.com/M4p4/django-bots"

[dependency-groups]
test = [
  "coverage[toml]",
  "pytest",
  "pytest-django",
  "pytest-randomly",
  "user-agents==2.2",
]
# Sphinx 9 needs Python 3.12 or newer.
docs = [
  "furo; python_version>='3.12'",
  "myst-parser; python_version>='3.12'",
  "sphinx; python_version>='3.12'",
]
django52 = [ "django>=5.2,<5.3" ]
# Django 6.0 and later need Python 3.12 or newer.
django60 = [ "django>=6,<6.1; python_version>='3.12'" ]
django61 = [ "django>=6.1,<6.2; python_version>='3.12'" ]

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.django_bots = [ "data/*", "py.typed" ]

[tool.uv]
# uv only auto-installs the `dev` group, so name the groups a bare `uv run`
# needs. The full version matrix is exercised by tox, not by the default env.
default-groups = [ "test", "django52" ]
conflicts = [
  [
    { group = "django52" },
    { group = "django60" },
    { group = "django61" },
  ],
]

[tool.ruff]
lint.select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # flake8-simplify
  "SIM",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
]
lint.ignore = [
  # flake8-bugbear opinionated rules
  "B9",
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
]
lint.extend-safe-fixes = [
  # non-pep585-annotation
  "UP006",
]
lint.isort.required-imports = [ "from __future__ import annotations" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true
overrides = [
  { module = "tests.*", allow_untyped_defs = true, allow_untyped_calls = true },
  { module = "crawleruseragents", ignore_missing_imports = true },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
ini_options.addopts = "-ra --strict-config --strict-markers"
ini_options.django_find_project = false
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage]
run.branch = true
run.data_file = ".coverage/cov"
run.parallel = true
run.source = [
  "django_bots",
  "tests",
]
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.fail_under = 100
report.show_missing = true
report.skip_covered = true
report.skip_empty = true
