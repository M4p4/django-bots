name: AI robots sync

on:
  schedule:
  - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      upstream:
        description: 'ai.robots.txt release tag to sync to (default: the latest release)'
        required: false
        type: string

concurrency:
  group: ai-robots-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Dispatching CI on the pull request branch needs actions: write.
      actions: write
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # frozen: v7.0.0
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # frozen: v8.3.2
      with:
        enable-cache: true
        python-version: '3.14'

    - name: Check for a newer ai.robots.txt release
      id: check
      # The dispatch input reaches the shell as an environment variable, so it can't be injected.
      env:
        GITHUB_TOKEN: ${{ github.token }}
        UPSTREAM: ${{ inputs.upstream }}
      run: |
        if [ -n "$UPSTREAM" ]; then
          uv run --frozen python scripts/check_upstream_version.py --upstream "$UPSTREAM"
        else
          uv run --frozen python scripts/check_upstream_version.py
        fi

    - name: Download the new data
      if: steps.check.outputs.sync == 'true'
      env:
        UPSTREAM: ${{ steps.check.outputs.upstream }}
      run: |
        cp src/django_bots/data/ai_robots.json "$RUNNER_TEMP/ai-robots-before.json"
        uv run --frozen python scripts/download_ai_robots.py "$UPSTREAM"

    - name: Bump the version and changelog
      id: bump
      if: steps.check.outputs.sync == 'true'
      env:
        UPSTREAM: ${{ steps.check.outputs.upstream }}
      run: uv run --frozen python scripts/bump_version.py "$UPSTREAM" --before "$RUNNER_TEMP/ai-robots-before.json"

    - name: Relock
      if: steps.bump.outputs.release != ''
      # uv.lock records the project version, so a bumped pyproject.toml needs a new lock.
      run: uv lock

    - name: Build the pull request body
      if: steps.check.outputs.sync == 'true'
      env:
        UPSTREAM: ${{ steps.check.outputs.upstream }}
        BUNDLED: ${{ steps.check.outputs.bundled }}
        RELEASE: ${{ steps.bump.outputs.release }}
      run: |
        {
          echo "Updates the bundled AI bot list from ai.robots.txt \`$BUNDLED\` to \`$UPSTREAM\`."
          echo
          echo "Opened automatically by the AI robots sync workflow."
          echo
          echo "## Changes"
          echo
          uv run --frozen python scripts/ai_bot_diff.py "$RUNNER_TEMP/ai-robots-before.json"
          echo
          echo "## Releasing"
          echo
          if [ -n "$RELEASE" ]; then
            echo "Merging does not publish. After merging, tag the merge commit to release \`$RELEASE\`:"
            echo
            echo '```console'
            echo "git switch main && git pull"
            echo "git tag $RELEASE && git push origin $RELEASE"
            echo '```'
          else
            echo "Other changes are waiting to be released, so this update was added under"
            echo "\`## Unreleased\` in the changelog and the version was not bumped. It ships"
            echo "with the next release."
          fi
        } > "$RUNNER_TEMP/pr-body.md"
        cat "$RUNNER_TEMP/pr-body.md"

    - name: Open a pull request
      id: pr
      if: steps.check.outputs.sync == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # frozen: v8.1.1
      with:
        branch: ai-robots-sync
        title: Update the AI bot list to ai.robots.txt ${{ steps.check.outputs.upstream }}
        body-path: ${{ runner.temp }}/pr-body.md
        commit-message: |
          feat: update the AI bot list to ai.robots.txt ${{ steps.check.outputs.upstream }}

          Generated by the AI robots sync workflow.
        delete-branch: true

    - name: Run CI on the pull request
      if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
      # Pull requests opened with GITHUB_TOKEN trigger no workflows, but a dispatch does.
      # Its checks report on the branch head, which is the pull request head.
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run main.yml --ref ai-robots-sync
